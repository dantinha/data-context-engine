[project]
name = "data-context-engine"
version = "0.1.0"
description = "Data Context Engine: Semantic layer, active clarification, prefix caching and SQL guardrails on DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.1",
    "sqlglot>=20.0.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
