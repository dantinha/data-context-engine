<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460">
  <defs>
    <linearGradient id="singleShotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="correctedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="820" height="460" rx="12" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="816" height="456" rx="10" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Title and Subtitle -->
  <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Data Context Engine: Accuracy by Context Level</text>
  <text x="40" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Progression from Zero-Context (L0) to Full Semantic Context Engine (L4) on Olist Gold Set (N=30)</text>

  <!-- Legend -->
  <rect x="480" y="32" width="14" height="14" rx="3" fill="url(#singleShotGrad)" />
  <text x="500" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Single-Shot</text>
  <rect x="590" y="32" width="14" height="14" rx="3" fill="url(#correctedGrad)" />
  <text x="610" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">w/ Self-Correction</text>

  <!-- Grid and Y Axis Labels -->
  <line x1="80" y1="380.0" x2="770" y2="380.0" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
  <text x="68" y="384.0" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">0%</text>
  <line x1="80" y1="305.0" x2="770" y2="305.0" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
  <text x="68" y="309.0" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">25%</text>
  <line x1="80" y1="230.0" x2="770" y2="230.0" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
  <text x="68" y="234.0" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">50%</text>
  <line x1="80" y1="155.0" x2="770" y2="155.0" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
  <text x="68" y="159.0" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">75%</text>
  <line x1="80" y1="125.0" x2="770" y2="125.0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9" />
  <text x="778" y="129.0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Target 85%</text>
  <line x1="80" y1="80.0" x2="770" y2="80.0" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
  <text x="68" y="84.0" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">100%</text>
  <!-- Bars -->
  <rect x="111.0" y="340.0" width="36.0" height="40.0" rx="4" fill="url(#singleShotGrad)" filter="url(#glow)"/>
  <text x="129.0" y="334.0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">13%</text>
  <rect x="151.0" y="330.0" width="36.0" height="50.0" rx="4" fill="url(#correctedGrad)" filter="url(#glow)"/>
  <text x="169.0" y="324.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">17%</text>
  <text x="149.0" y="402.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">L0</text>
  <text x="149.0" y="418.0" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">498 tok</text>
  <rect x="249.0" y="280.0" width="36.0" height="100.0" rx="4" fill="url(#singleShotGrad)" filter="url(#glow)"/>
  <text x="267.0" y="274.0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">33%</text>
  <rect x="289.0" y="270.0" width="36.0" height="110.0" rx="4" fill="url(#correctedGrad)" filter="url(#glow)"/>
  <text x="307.0" y="264.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">37%</text>
  <text x="287.0" y="402.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">L1</text>
  <text x="287.0" y="418.0" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">5861 tok</text>
  <rect x="387.0" y="220.0" width="36.0" height="160.0" rx="4" fill="url(#singleShotGrad)" filter="url(#glow)"/>
  <text x="405.0" y="214.0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">53%</text>
  <rect x="427.0" y="210.0" width="36.0" height="170.0" rx="4" fill="url(#correctedGrad)" filter="url(#glow)"/>
  <text x="445.0" y="204.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">57%</text>
  <text x="425.0" y="402.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">L2</text>
  <text x="425.0" y="418.0" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1269 tok</text>
  <rect x="525.0" y="170.0" width="36.0" height="210.0" rx="4" fill="url(#singleShotGrad)" filter="url(#glow)"/>
  <text x="543.0" y="164.0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">70%</text>
  <rect x="565.0" y="160.0" width="36.0" height="220.0" rx="4" fill="url(#correctedGrad)" filter="url(#glow)"/>
  <text x="583.0" y="154.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">73%</text>
  <text x="563.0" y="402.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">L3</text>
  <text x="563.0" y="418.0" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">3065 tok</text>
  <rect x="663.0" y="130.0" width="36.0" height="250.0" rx="4" fill="url(#singleShotGrad)" filter="url(#glow)"/>
  <text x="681.0" y="124.0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">83%</text>
  <rect x="703.0" y="120.0" width="36.0" height="260.0" rx="4" fill="url(#correctedGrad)" filter="url(#glow)"/>
  <text x="721.0" y="114.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">87%</text>
  <text x="701.0" y="402.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">L4</text>
  <text x="701.0" y="418.0" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">2070 tok</text>
</svg>